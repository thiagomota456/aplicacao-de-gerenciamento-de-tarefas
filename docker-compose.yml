services:
  postgres:
    image: postgres:15
    container_name: taskmanager_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: taskmanager
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./TaskManagerApi
      dockerfile: Dockerfile
    container_name: taskmanager_api
    ports:
      - "8080:8080"
    environment:
      - ConnectionStrings__Default=Host=postgres;Port=5432;Database=taskmanager;Username=postgres;Password=postgres
      - Jwt__Key=SegredoSuperSecretoParaAssinarOJwt123!
      - Jwt__Issuer=TaskManagerApi
      - Jwt__Audience=TaskManagerApi
    depends_on:
      - postgres
    restart: on-failure

  ui:
    build:
      context: ./taskmanager-ui
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: http://localhost:8080
    container_name: taskmanager_ui
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: on-failure

volumes:
  postgres_data:
